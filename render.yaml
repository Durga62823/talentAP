services:
  - type: web
    name: talentap-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r FULL_CODE/backend/requirements.txt"
    # --forwarded-allow-ips: trust Render's proxy so request.client is the real visitor IP
    # (the login lockout is keyed on it; otherwise every visitor shares one IP).
    startCommand: "python -m uvicorn app.main:app --app-dir FULL_CODE/backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SENTINEL_ENV
        value: production
      - key: SENTINEL_DATASET_DIR
        value: Datasets
      - key: SENTINEL_ALLOWED_DB_HOSTS
        value: localhost,127.0.0.1
      # The Vercel frontend proxies /api (same origin), so no browser origin needs CORS.
      - key: SENTINEL_CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      # Free-plan disk is wiped on every restart; pin these (64 hex chars each, e.g.
      # `python -c "import secrets;print(secrets.token_hex(32))"`) so pseudonym hashes stay stable.
      - key: SENTINEL_HMAC_KEY
        sync: false
      - key: SENTINEL_CREDENTIAL_KEY
        sync: false
      # Gemini AI classification (optional). Set the key in the Render dashboard; never commit it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
